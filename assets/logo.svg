<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="klpTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="klpTitle">Karam Land Promoters</title>
  <defs>
    <linearGradient id="klpGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4C878"/>
      <stop offset="1" stop-color="#B8912F"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="47" fill="#17241D"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#klpGold)" stroke-width="1.4"/>
  <!-- sun arc -->
  <circle cx="50" cy="46" r="12" fill="none" stroke="url(#klpGold)" stroke-width="2"/>
  <!-- horizon -->
  <line x1="18" y1="60" x2="82" y2="60" stroke="url(#klpGold)" stroke-width="1.6"/>
  <!-- plot grid beneath horizon -->
  <g stroke="#B8912F" stroke-width="1" opacity="0.6">
    <line x1="30" y1="60" x2="24" y2="76"/>
    <line x1="50" y1="60" x2="50" y2="78"/>
    <line x1="70" y1="60" x2="76" y2="76"/>
    <line x1="24" y1="76" x2="76" y2="76"/>
  </g>
  <!-- monogram K, minimal, sits over horizon -->
  <g fill="none" stroke="#F7F4EC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="38" y1="38" x2="38" y2="62"/>
    <line x1="38" y1="52" x2="58" y2="38"/>
    <line x1="44" y1="55" x2="58" y2="62"/>
  </g>
</svg>
